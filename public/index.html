<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบขอและต่ออายุใบอนุญาตออนไลน์ - กองสาธารณสุข อบต.เชิงทะเล</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-slate-100 font-sans min-h-screen text-slate-800">

    <!-- Navbar -->
    <nav class="bg-gradient-to-r from-blue-900 via-blue-800 to-indigo-900 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-3.5 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-white/10 rounded-xl flex items-center justify-center font-bold text-lg">
                    <i class="fa-solid fa-building-columns text-blue-300"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base md:text-lg leading-tight">อบต.เชิงทะเล</h1>
                    <p class="text-xs text-blue-200">ระบบขอใบอนุญาตด้านสาธารณสุข</p>
                </div>
            </div>
            <a href="track.html" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-xl text-xs md:text-sm font-semibold transition shadow flex items-center gap-2">
                <i class="fa-solid fa-magnifying-glass"></i> ติดตามสถานะคำขอ
            </a>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="max-w-3xl mx-auto my-8 px-4">
        <div class="bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
            
            <!-- Form Header Banner -->
            <div class="bg-gradient-to-r from-blue-50 to-indigo-50 p-6 md:p-8 border-b border-slate-100 text-center">
                <div class="w-14 h-14 bg-blue-600 text-white rounded-2xl mx-auto flex items-center justify-center text-2xl shadow-md mb-3">
                    <i class="fa-solid fa-file-signature"></i>
                </div>
                <h2 class="text-2xl font-extrabold text-slate-800">ยื่นคำขอ / ต่ออายุใบอนุญาต</h2>
                <p class="text-slate-500 text-xs md:text-sm mt-1">กองสาธารณสุขและสิ่งแวดล้อม องค์การบริหารส่วนตำบลเชิงทะเล อำเภอถลาง ภูเก็ต</p>
            </div>

            <form id="permitForm" class="p-6 md:p-8 space-y-6">
                <!-- ประเภทคำขอ -->
                <div class="bg-slate-50 p-5 rounded-xl border border-slate-200">
                    <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-3">ประสงค์จะยื่นคำขอเรื่อง *</label>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <label class="flex items-center space-x-3 p-3 bg-white rounded-lg border border-slate-200 cursor-pointer hover:border-blue-500 transition shadow-sm">
                            <input type="radio" name="app_type" value="NEW" checked class="w-4 h-4 text-blue-600 focus:ring-blue-500" onchange="toggleRenewInput()">
                            <div>
                                <span class="font-bold text-slate-800 text-sm block">ขอใบอนุญาตใหม่</span>
                                <span class="text-xs text-slate-500">สำหรับผู้ประกอบการรายใหม่</span>
                            </div>
                        </label>
                        <label class="flex items-center space-x-3 p-3 bg-white rounded-lg border border-slate-200 cursor-pointer hover:border-blue-500 transition shadow-sm">
                            <input type="radio" name="app_type" value="RENEW" class="w-4 h-4 text-blue-600 focus:ring-blue-500" onchange="toggleRenewInput()">
                            <div>
                                <span class="font-bold text-slate-800 text-sm block">ต่ออายุใบอนุญาตเดิม</span>
                                <span class="text-xs text-slate-500">สำหรับกิจการที่มีใบอนุญาตอยู่แล้ว</span>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- เลขใบอนุญาตเดิม (ซ่อนไว้ถ้าเป็นขอใหม่) -->
                <div id="renewBox" class="hidden bg-amber-50 p-4 rounded-xl border border-amber-200">
                    <label class="block text-xs font-bold text-amber-900 uppercase tracking-wider mb-1">เลขที่ใบอนุญาตเดิม *</label>
                    <input type="text" id="old_license_no" placeholder="เช่น สส. 2568/0012" class="w-full mt-1 p-2.5 border border-amber-300 rounded-lg bg-white text-sm focus:ring-2 focus:ring-amber-500 outline-none">
                </div>

                <!-- ข้อมูลผู้ยื่น -->
                <div class="space-y-4">
                    <h3 class="text-sm font-bold text-slate-700 flex items-center gap-2 border-b pb-2">
                        <i class="fa-solid fa-user-shield text-blue-600"></i> ข้อมูลผู้ขออนุญาต
                    </h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">ชื่อ-นามสกุล ผู้ขออนุญาต *</label>
                            <input type="text" id="applicant_name" required placeholder="นาย / นาง / นางสาว..." class="w-full p-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">เลขบัตรประจำตัวประชาชน (13 หลัก) *</label>
                            <input type="text" id="id_card" maxlength="13" required placeholder="เลขบัตรประชาชน 13 หลัก" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">เบอร์โทรศัพท์ติดต่อ *</label>
                            <input type="tel" id="phone" required placeholder="0812345678" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">อีเมล (ถ้ามี)</label>
                            <input type="email" id="email" placeholder="example@email.com" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                    </div>
                </div>

                <!-- ข้อมูลร้านค้า -->
                <div class="space-y-4 pt-2">
                    <h3 class="text-sm font-bold text-slate-700 flex items-center gap-2 border-b pb-2">
                        <i class="fa-solid fa-store text-blue-600"></i> ข้อมูลสถานประกอบการ
                    </h3>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">ชื่อร้านค้า / สถานประกอบการ *</label>
                        <input type="text" id="business_name" required placeholder="ระบุชื่อร้าน" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">ประเภทกิจการ *</label>
                        <select id="business_type" class="w-full p-2.5 border border-slate-300 rounded-lg bg-white text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                            <option value="สถานที่จำหน่ายอาหาร หรือ สะสมอาหาร">สถานที่จำหน่ายอาหาร หรือ สะสมอาหาร</option>
                            <option value="กิจการที่เป็นอันตรายต่อสุขภาพ">กิจการที่เป็นอันตรายต่อสุขภาพ</option>
                            <option value="จำหน่ายสินค้าในที่หรือทางสาธารณะ">จำหน่ายสินค้าในที่หรือทางสาธารณะ</option>
                            <option value="การตลาดสินค้าอาหาร/ตลาดสด">การตลาดสินค้าอาหาร / ตลาดสด</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">ที่ตั้งสถานประกอบการ (เลขที่ / หมู่ที่ / ถนน / ซอย / ตำบล) *</label>
                        <textarea id="location_address" rows="2" required placeholder="ระบุที่ตั้งอย่างละเอียด..." class="w-full p-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                    </div>

                    <!-- ส่วนแนบลิงก์เอกสาร -->
                    <div class="bg-blue-50/50 p-4 rounded-xl border border-blue-100">
                        <label class="block text-xs font-bold text-blue-900 mb-1"><i class="fa-solid fa-link"></i> แนบลิงก์เอกสารประกอบ (Google Drive / OneDrive / รูปถ่าย)</label>
                        <input type="url" id="doc_url" placeholder="https://drive.google.com/..." class="w-full p-2.5 border border-blue-200 rounded-lg text-sm bg-white focus:ring-2 focus:ring-blue-500 outline-none">
                        <p class="text-[11px] text-slate-500 mt-1.5">* รวบรวมสำเนาบัตรประชาชน, ทะเบียนบ้าน, แผนผังร้าน หรือใบอนุญาตเดิมไว้ในลิงก์เดียว</p>
                    </div>
                </div>

                <button type="submit" id="btnSubmit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3.5 rounded-xl font-bold transition shadow-lg shadow-blue-600/20 flex items-center justify-center gap-2 text-base">
                    <i class="fa-solid fa-paper-plane"></i> ส่งคำขอใบอนุญาต
                </button>
            </form>
        </div>
    </main>

    <script>
        function toggleRenewInput() {
            const isRenew = document.querySelector('input[name="app_type"]:checked').value === 'RENEW';
            document.getElementById('renewBox').classList.toggle('hidden', !isRenew);
        }

        document.getElementById('permitForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> กำลังส่งข้อมูล...';

            const appType = document.querySelector('input[name="app_type"]:checked').value;
            const payload = {
                app_type: appType,
                old_license_no: appType === 'RENEW' ? document.getElementById('old_license_no').value : '',
                applicant_name: document.getElementById('applicant_name').value,
                id_card: document.getElementById('id_card').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                business_name: document.getElementById('business_name').value,
                business_type: document.getElementById('business_type').value,
                location_address: document.getElementById('location_address').value,
                doc_url: document.getElementById('doc_url').value
            };

            try {
                const res = await fetch('/api/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (data.success) {
                    Swal.fire({
                        icon: 'success',
                        title: 'ยื่นคำขอสำเร็จ!',
                        html: `เลขที่คำขอของคุณคือ:<br><b class="text-2xl text-blue-600 font-mono mt-1 inline-block">${data.app_no}</b>`,
                        confirmButtonText: 'ไปหน้าติดตามสถานะ',
                        confirmButtonColor: '#2563eb'
                    }).then(() => {
                        window.location.href = `track.html?app_no=${data.app_no}`;
                    });
                } else {
                    Swal.fire('เกิดข้อผิดพลาด', data.message, 'error');
                }
            } catch (err) {
                Swal.fire('ข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> ส่งคำขอใบอนุญาต';
            }
        });
    </script>
</body>
</html>
