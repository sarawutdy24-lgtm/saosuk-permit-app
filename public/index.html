<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบขอและต่ออายุใบอนุญาตออนไลน์ - กองสาธารณสุข อบต.เชิงทะเล</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-slate-100 font-sans min-h-screen">
    <!-- Navbar -->
    <nav class="bg-blue-900 text-white shadow-lg p-4">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <h1 class="font-bold text-lg md:text-xl">อบต.เชิงทะเล | ระบบขอใบอนุญาตออนไลน์</h1>
            <a href="track.html" class="bg-blue-700 hover:bg-blue-600 px-4 py-2 rounded-lg text-sm transition">ติดตามสถานะคำขอ</a>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="max-w-3xl mx-auto my-8 p-6 md:p-8 bg-white rounded-xl shadow-md">
        <h2 class="text-2xl font-bold text-slate-800 text-center mb-2">ยื่นคำขอ / ต่ออายุใบอนุญาต</h2>
        <p class="text-slate-500 text-center text-sm mb-6">กองสาธารณสุขและสิ่งแวดล้อม องค์การบริหารส่วนตำบลเชิงทะเล</p>

        <form id="permitForm" class="space-y-5">
            <!-- ประเภทคำขอ -->
            <div class="bg-slate-50 p-4 rounded-lg border">
                <label class="block text-sm font-semibold text-gray-700 mb-2">ประสงค์จะยื่นคำขอเรื่อง *</label>
                <div class="flex gap-6">
                    <label class="flex items-center space-x-2 cursor-pointer">
                        <input type="radio" name="app_type" value="NEW" checked class="w-4 h-4 text-blue-600" onchange="toggleRenewInput()">
                        <span class="text-gray-800 font-medium">ขอใบอนุญาตใหม่</span>
                    </label>
                    <label class="flex items-center space-x-2 cursor-pointer">
                        <input type="radio" name="app_type" value="RENEW" class="w-4 h-4 text-blue-600" onchange="toggleRenewInput()">
                        <span class="text-gray-800 font-medium">ต่ออายุใบอนุญาตเดิม</span>
                    </label>
                </div>
            </div>

            <!-- เลขใบอนุญาตเดิม (ซ่อนไว้ถ้าเป็นขอใหม่) -->
            <div id="renewBox" class="hidden bg-amber-50 p-4 rounded-lg border border-amber-200">
                <label class="block text-sm font-semibold text-amber-900">เลขที่ใบอนุญาตเดิม *</label>
                <input type="text" id="old_license_no" placeholder="เช่น สส. 2568/0012" class="w-full mt-1 p-2 border rounded-md bg-white">
            </div>

            <!-- ข้อมูลผู้ยื่น -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">ชื่อ-นามสกุล ผู้ขออนุญาต *</label>
                    <input type="text" id="applicant_name" required class="w-full mt-1 p-2 border rounded-md">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">เลขบัตรประชาชน (13 หลัก) *</label>
                    <input type="text" id="id_card" maxlength="13" required class="w-full mt-1 p-2 border rounded-md">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">เบอร์โทรศัพท์ติดต่อ *</label>
                    <input type="tel" id="phone" required class="w-full mt-1 p-2 border rounded-md">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">อีเมล (ถ้ามี)</label>
                    <input type="email" id="email" class="w-full mt-1 p-2 border rounded-md">
                </div>
            </div>

            <hr class="my-4">

            <!-- ข้อมูลร้านค้า -->
            <div>
                <label class="block text-sm font-medium text-gray-700">ชื่อร้านค้า / สถานประกอบการ *</label>
                <input type="text" id="business_name" required class="w-full mt-1 p-2 border rounded-md">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">ประเภทกิจการ *</label>
                <select id="business_type" class="w-full mt-1 p-2 border rounded-md bg-white">
                    <option value="สถานที่จำหน่ายอาหาร หรือ สะสมอาหาร">สถานที่จำหน่ายอาหาร หรือ สะสมอาหาร</option>
                    <option value="กิจการที่เป็นอันตรายต่อสุขภาพ">กิจการที่เป็นอันตรายต่อสุขภาพ</option>
                    <option value="จำหน่ายสินค้าในที่หรือทางสาธารณะ">จำหน่ายสินค้าในที่หรือทางสาธารณะ</option>
                    <option value="การตลาดสินค้าอาหาร/ตลาดสด">การตลาดสินค้าอาหาร / ตลาดสด</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">ที่ตั้งสถานประกอบการ (เลขที่ / หมู่ที่ / ถนน / ซอย) *</label>
                <textarea id="location_address" rows="2" required class="w-full mt-1 p-2 border rounded-md"></textarea>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">แนบลิงก์เอกสารประกอบ (เช่น ลิงก์ Google Drive / รูปถ่าย)</label>
                <input type="url" id="doc_url" placeholder="https://drive.google.com/..." class="w-full mt-1 p-2 border rounded-md text-sm">
                <span class="text-xs text-gray-500">* รวมสำเนาบัตรประชาชน, สำเนาทะเบียนบ้าน, แผนผังร้าน หรือใบอนุญาตเดิมไว้ในลิงก์เดียว</span>
            </div>

            <button type="submit" id="btnSubmit" class="w-full bg-blue-700 text-white py-3.5 rounded-lg font-bold hover:bg-blue-800 transition shadow">
                ส่งคำขอใบอนุญาต
            </button>
        </form>
    </div>

    <script>
        function toggleRenewInput() {
            const isRenew = document.querySelector('input[name="app_type"]:checked').value === 'RENEW';
            document.getElementById('renewBox').classList.toggle('hidden', !isRenew);
        }

        document.getElementById('permitForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;
            btn.innerText = 'กำลังส่งข้อมูล...';

            const appType = document.querySelector('input[name="app_type"]:checked').value;
            const payload = {
                app_type: appType,
                old_license_no: appType === 'RENEW' ? document.getElementById('old_license_no').value : '',
                applicant_name: document.getElementById('applicant_name').value,
                id_card: document.getElementById('id_card').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                business_name: document.getElementById('business_name').value,
                business_type: document.getElementById('business_type').value,
                location_address: document.getElementById('location_address').value,
                doc_url: document.getElementById('doc_url').value
            };

            try {
                const res = await fetch('/api/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (data.success) {
                    Swal.fire({
                        icon: 'success',
                        title: 'ยื่นคำขอสำเร็จ!',
                        html: `โปรดเก็บบันทึกเลขที่คำขอของคุณไว้:<br><b class="text-2xl text-blue-700">${data.app_no}</b>`,
                        confirmButtonText: 'รับทราบ & ติดตามสถานะ'
                    }).then(() => {
                        window.location.href = `track.html?app_no=${data.app_no}`;
                    });
                } else {
                    Swal.fire('เกิดข้อผิดพลาด', data.message, 'error');
                }
            } catch (err) {
                Swal.fire('ข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้', 'error');
            } finally {
                btn.disabled = false;
                btn.innerText = 'ส่งคำขอใบอนุญาต';
            }
        });
    </script>
</body>
</html>
